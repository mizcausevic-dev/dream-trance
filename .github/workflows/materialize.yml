name: Materialize pack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install ffmpeg and the disclosure font
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg fonts-dejavu-core
          find . -type d -name __pycache__ -exec rm -rf {} + || true
          touch .nojekyll

      - name: Build the pack from the committed generator
        run: python3 tools/build_pack.py

      - name: Commit delivered files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Pack bytes already match this commit."
          else
            git commit -m "Materialize Dream Trance [skip ci]"
            git push origin HEAD:main
          fi
          git push origin HEAD:gh-pages

      - name: Enable GitHub Pages from gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          echo "pages create status ${code}"
          cat /tmp/pages.json
          echo
          if [ "${code}" = "201" ] || [ "${code}" = "409" ]; then
            echo "Pages source recorded."
          else
            echo "Pages API returned ${code}. Branch gh-pages is already pushed. Not retrying."
          fi
          curl -sS -o /tmp/topics.json -w "topics %{http_code}\n" -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/topics" \
            -d '{"names":["midi","trance","music-production","composition","construction-kit"]}' || true
          cat /tmp/topics.json || true
          echo
          exit 0
